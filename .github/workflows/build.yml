name: Build Tandora

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"
  EXPORT_PRESET_LINUX: "Linux"
  EXPORT_PRESET_WEB: "Web"

jobs:
  # ── Build Linux server binary ─────────────────────────────────────────────
  # On master, also publishes it as the 'latest' release — that release is
  # what the Unraid box auto-deploys (it polls it, no auth needed).
  build-linux:
    name: Build Linux Server
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize release publishes so two back-to-back master builds can't race
    # and have the older binary win the 'latest' tag.
    concurrency:
      group: tandora-latest-release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update version.cfg
        run: chmod +x ./update_version.sh && ./update_version.sh

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          GODOT_FILENAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          TEMPLATES_FILENAME="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_FILENAME}.zip"
          unzip -q "${GODOT_FILENAME}.zip"
          mkdir -p ~/.local/bin
          mv "${GODOT_FILENAME}" ~/.local/bin/godot
          chmod +x ~/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TEMPLATES_FILENAME}"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "${TEMPLATES_FILENAME}" -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Export Linux
        run: |
          mkdir -p build_linux
          godot --headless --export-release "${{ env.EXPORT_PRESET_LINUX }}" "build_linux/tandora.x86_64"

      - name: Publish 'latest' release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          # Replace the previous 'latest' release (name+tag) with this build.
          gh release delete latest --cleanup-tag 2>/dev/null || true
          gh release create latest build_linux/tandora.x86_64 \
            --title "Tandora server ${SHA:0:8}" \
            --notes "Auto-published from commit ${SHA:0:8} on master."

  # ── Build Web export ──────────────────────────────────────────────────────
  build-web:
    name: Build Web Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update version.cfg
        run: chmod +x ./update_version.sh && ./update_version.sh

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          GODOT_FILENAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          TEMPLATES_FILENAME="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_FILENAME}.zip"
          unzip -q "${GODOT_FILENAME}.zip"
          mkdir -p ~/.local/bin
          mv "${GODOT_FILENAME}" ~/.local/bin/godot
          chmod +x ~/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TEMPLATES_FILENAME}"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "${TEMPLATES_FILENAME}" -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Export Web
        run: |
          mkdir -p build_web
          godot --headless --export-release "${{ env.EXPORT_PRESET_WEB }}" "build_web/index.html"

      - name: Inject cache-busting meta tag and build marker
        # The build marker records which commit the deployed index.html was
        # built from, so the live Pages site can be verified as current.
        run: |
          SHA="${GITHUB_SHA:0:8}"
          sed -i "s|<head>|<head>\n  <meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\n  <meta http-equiv=\"Pragma\" content=\"no-cache\">\n  <meta http-equiv=\"Expires\" content=\"0\">\n  <!-- build: ${SHA} -->|" build_web/index.html

      - name: Deploy to GitHub Pages repo
        if: github.ref == 'refs/heads/master'
        env:
          TANDORA_PAGES_SSH_KEY: ${{ secrets.TANDORA_PAGES_SSH_KEY }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Push with a repo-scoped SSH deploy key (write access to
          # tandoraweb only). The old PAGES_DEPLOY_TOKEN PAT is scoped to
          # the retired NuclearQuads/nuclearquads.github.io target.
          mkdir -p ~/.ssh
          printf '%s\n' "$TANDORA_PAGES_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,ecdsa,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone git@github.com:SpencerGraffunder/tandoraweb.git pages_repo
          # Replace the repo contents with the fresh export at ROOT (Pages
          # serves /tandoraweb/<file> from the repo root). Keep .git, README.md
          # and .nojekyll — tandoraweb is NOT a Jekyll site, so .nojekyll must
          # stay at root for GitHub Pages to serve the Godot files verbatim.
          find pages_repo -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md ! -name .nojekyll -exec rm -rf {} +
          cp -r build_web/. pages_repo/
          # Legacy Pages binds custom domains from the CNAME file
          # committed in the branch; rewrite it on every deploy so the
          # content wipe above never unbinds tandora.nuclearquads.com.
          printf 'tandora.nuclearquads.com\n' > pages_repo/CNAME
          cd pages_repo
          git add -A
          git diff --cached --quiet || git commit -m "Deploy Tandora web build from ${{ github.sha }}"
          git push
